<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nói Dối Như Cuội 3D</title>
<style>
  :root { --hud: rgba(236, 240, 244, 0.92); --dim: rgba(236, 240, 244, 0.5); --warn: #ff5a3c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--hud);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; text-shadow: 0 1px 3px rgba(0,0,0,.55); }
  #hud.on { opacity: 1; }

  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: 8px; transition: opacity .12s; }
  #crosshair i { position: absolute; background: var(--hud); box-shadow: 0 0 2px rgba(0,0,0,.8); }
  #crosshair i:nth-child(1) { width: 2px; height: 7px; left: -1px; top: calc(-7px - var(--gap)); }
  #crosshair i:nth-child(2) { width: 2px; height: 7px; left: -1px; top: var(--gap); }
  #crosshair i:nth-child(3) { height: 2px; width: 7px; top: -1px; left: calc(-7px - var(--gap)); }
  #crosshair i:nth-child(4) { height: 2px; width: 7px; top: -1px; left: var(--gap); }
  #crosshair i:nth-child(5) { width: 2px; height: 2px; left: -1px; top: -1px; opacity: .8; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px; opacity: 0; transform: rotate(45deg); }
  #hitmarker::before, #hitmarker::after { content: ""; position: absolute; background:
    linear-gradient(90deg, currentColor 0 32%, transparent 32% 68%, currentColor 68%); }
  #hitmarker::before { left: 0; right: 0; top: 12px; height: 2px; }
  #hitmarker::after { top: 0; bottom: 0; left: 12px; width: 2px; background:
    linear-gradient(180deg, currentColor 0 32%, transparent 32% 68%, currentColor 68%); }
  #dmgdir { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; margin: -150px; opacity: 0; }
  #dmgdir::before { content: ""; position: absolute; left: 50%; top: 0; width: 120px; height: 34px; margin-left: -60px;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,60,30,.95), rgba(255,60,30,0) 70%); border-radius: 50%; }

  .corner { position: absolute; bottom: 34px; display: flex; flex-direction: column; gap: 8px; }
  #vitals { left: 40px; width: 250px; }
  #vitals .label, #ammo .label { font-size: 11px; letter-spacing: .22em; color: var(--dim); }
  #hpbar { height: 5px; background: rgba(255,255,255,.16); position: relative; }
  #hpbar b { position: absolute; inset: 0; background: var(--hud); transform-origin: left; transition: background .2s; }
  #hpnum { font-size: 26px; font-weight: 300; }
  #ammo { right: 40px; align-items: flex-end; }
  #ammo .count { font-size: 46px; font-weight: 200; line-height: 1; }
  #ammo .count small { font-size: 20px; color: var(--dim); margin-left: 6px; }
  #ammo.low .count { color: var(--warn); }
  #pips { display: flex; gap: 4px; }
  #pips i { width: 5px; height: 14px; background: var(--hud); border-radius: 1px; }
  #pips i.off { background: rgba(255,255,255,.18); }

  #objective { position: absolute; top: 30px; left: 40px; font-size: 12px; letter-spacing: .22em; }
  #objective b { display: block; font-size: 20px; font-weight: 300; letter-spacing: .12em; margin-top: 4px; }
  #stats { position: absolute; top: 30px; right: 40px; font-size: 11px; color: var(--dim); text-align: right; letter-spacing: .08em; line-height: 1.6; }
  #banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; opacity: 0; transition: opacity .5s; }
  #banner.on { opacity: 1; }
  #banner b { display: block; font-size: 44px; font-weight: 200; letter-spacing: .5em; margin-right: -.5em; }
  #banner span { font-size: 13px; letter-spacing: .3em; color: var(--dim); }
  #prompt { position: absolute; left: 0; right: 0; bottom: 29%; text-align: center; font-size: 13px; letter-spacing: .24em; opacity: 0; transition: opacity .2s; }
  #prompt.on { opacity: 1; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at center, rgba(8,10,12,.38), rgba(4,5,6,.86)); transition: opacity .35s; cursor: pointer; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay.loading { background: #050607; cursor: default; }
  #panel { max-width: min(640px, 94vw); padding: 24px; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
  #panel h1 { font-size: clamp(20px, 4.4vw, 48px); font-weight: 200; letter-spacing: .26em; margin: 0 -.26em 6px 0; white-space: nowrap; }
  #panel .sub { font-size: 12px; letter-spacing: .34em; color: var(--dim); margin-bottom: 38px; }
  #panel .cta { font-size: 15px; letter-spacing: .3em; margin: 34px 0 0; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #keys { display: grid; grid-template-columns: repeat(4, auto); white-space: nowrap; gap: 10px 26px; justify-content: center; font-size: 12px; color: var(--dim); letter-spacing: .06em; text-align: left; }
  #keys kbd { font: inherit; color: var(--hud); border: 1px solid rgba(255,255,255,.3); border-radius: 3px; padding: 1px 6px; margin-right: 6px; }
  #loadbar { width: 280px; height: 2px; background: rgba(255,255,255,.15); margin: 26px auto 10px; }
  #loadbar b { display: block; height: 100%; width: 0; background: var(--hud); transition: width .2s; }
  #loadtext { font-size: 11px; letter-spacing: .28em; color: var(--dim); }
  #result { font-size: 13px; letter-spacing: .12em; color: var(--dim); line-height: 1.9; }
  #radio { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); width: min(70%, 760px); text-align: center; opacity: 0; transition: opacity .25s; }
  #radio.on { opacity: 1; }
  #radio span { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .34em; padding: 2px 10px 2px 13px; background: var(--hud); color: #0a0c0e; text-shadow: none; margin-bottom: 8px; }
  #radio.red span { background: var(--warn); color: #fff; }
  #radio p { margin: 0; font-size: clamp(15px, 1.7vw, 22px); line-height: 1.4; text-shadow: 0 2px 8px rgba(0,0,0,.95), 0 0 2px #000; text-wrap: balance; min-height: 1.4em; }
  #retries { position: absolute; top: 96px; left: 40px; font-size: 11px; letter-spacing: .22em; color: var(--dim); }
  #ammo, #crosshair i:not(:nth-child(5)), #vitals { display: none !important; }
  #tint { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(255,30,40,.06), rgba(255,20,30,.3)); opacity: 0; transition: opacity .5s; }
  #tint.on { opacity: 1; }
  .hide { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="tint"></div>
<div id="hud">
  <div id="objective">NHIỆM VỤ<b id="objtext">VỀ HỘI TRĂNG RẰM</b></div>
  <div id="stats" class="mono"></div>
  <div id="banner"><b id="bannertitle"></b><span id="bannersub"></span></div>
  <div id="prompt"></div>
  <div id="retries"></div>
  <div id="radio"><span>CUỘI</span><p id="radiotext"></p></div>
  <div id="dmgdir"></div>
  <div id="crosshair"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="hitmarker"></div>
  <div id="vitals" class="corner">
    <div class="label">VITALS</div>
    <div id="hpnum" class="mono">100</div>
    <div id="hpbar"><b></b></div>
  </div>
  <div id="ammo" class="corner">
    <div class="label">P38 &nbsp;·&nbsp; 9×19</div>
    <div class="count mono"><span id="mag">8</span><small id="reserve">48</small></div>
    <div id="pips"></div>
  </div>
</div>

<div id="overlay" class="loading">
  <div id="panel">
    <h1>NÓI DỐI NHƯ CUỘI</h1>
    <div class="sub">ĐÊM RẰM · GÓC NHÌN THỨ NHẤT</div>
    <div id="loading">
      <div id="loadbar"><b></b></div>
      <div id="loadtext">ĐANG TẢI</div>
    </div>
    <div id="menu" class="hide">
      <div id="result" class="hide"></div>
      <div id="keys">
        <span><kbd>W A S D</kbd>đi</span><span><kbd>CHUỘT</kbd>nhìn</span><span><kbd>SHIFT</kbd>chạy</span><span><kbd>SPACE</kbd>nhảy</span>
        <span><kbd>C</kbd>cúi</span><span><kbd>G</kbd>đồ hoạ</span><span><kbd>M</kbd>tắt tiếng</span><span><kbd>ESC</kbd>tạm dừng</span>
      </div>
      <div class="cta" id="cta">BẤM ĐỂ BẮT ĐẦU</div>
    </div>
  </div>
</div>

<script>window.BRICKYARD_MODE = "cuoi";</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
